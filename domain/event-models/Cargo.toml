[package]
name = "event-models"
version = "0.1.0"
edition = "2021"

[features]
default = ["in_memory", "automerge"]
cbor = ["serde_cbor"]
shared_tests = []
in_memory = []
automerge = ["dep:automerge", "autosurgeon"]

[dependencies]
epoch = { git = "https://github.com/Shearerbeard/Epoch", rev = "25e8a17", default-features = false, features = ["in_memory"] }
itertools = "0.10.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = { version = "0.11", optional = true }
automerge = { version = "0.4.0", optional = true }
autosurgeon = { version = "0.5.0", features = ["uuid"], optional = true }

[dependencies.url]
version = "2.3"
features = [ "serde" ]

[dependencies.uuid]
version = "1.3"
features = [
    "v4",
    "v5",
    "fast-rng",
    "macro-diagnostics",
    "serde"
]
