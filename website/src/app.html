<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicon/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon/favicon/favicon-16x16.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<meta name="viewport" content="width=device-width" />
		<!-- HTML Meta Tags -->
		<title>Evident Stack</title>
		<meta name="description" content="Each layer in the Stack can be used individually, but work best together since each layer builds upon the one before it.">

		<!-- Facebook Meta Tags -->
		<meta property="og:url" content="https://evidentstack.com/">
		<meta property="og:type" content="website">
		<meta property="og:title" content="Evident Stack">
		<meta property="og:description" content="Each layer in the Stack can be used individually, but work best together since each layer builds upon the one before it.">
		<meta property="og:image" content="%sveltekit.assets%/social/OGEvidentStack.jpg">

		<!-- Twitter Meta Tags -->
		<meta name="twitter:card" content="summary_large_image">
		<meta property="twitter:domain" content="evidentstack.com">
		<meta property="twitter:url" content="https://evidentstack.com/">
		<meta name="twitter:title" content="Evident Stack">
		<meta name="twitter:description" content="Each layer in the Stack can be used individually, but work best together since each layer builds upon the one before it.">
		<meta name="twitter:image" content="%sveltekit.assets%/social/OGEvidentStack.jpg"

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
