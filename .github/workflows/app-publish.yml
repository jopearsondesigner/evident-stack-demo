---
name: Publish App to Production
run-name: Production App publish by ${{ github.actor }}
on:
  release:
    types:
      - published
    paths:
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'domain/**'
      - 'components/**'
      - 'app/**'
jobs:
  Publish:
    runs-on: ubuntu-latest
    environment: evidentstack-app (Production)
    permissions:
      contents: read
      deployments: write
    name: Publish App to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build editor-state
        run: npm -w app run state:build

      - name: Install dependencies
        run: npm -w app i && npm -w components i

      - name: Install playwright browsers
        run: npx playwright install --with-deps

      - name: Test
        run: npm -w app run check && npm -w app run test
        env:
          PUBLIC_SUPABASE_URL: TODO
          PUBLIC_SUPABASE_ANON_KEY: TODO

      - name: Build
        run: npm -w app run build
        env:
          PUBLIC_SUPABASE_URL: TODO
          PUBLIC_SUPABASE_ANON_KEY: TODO

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_KEY }}
          accountId: 24a2b0f48cf4f2d0cd375521394e63bd
          projectName: evidentstack-app
          directory: app/.svelte-kit/cloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          environment: production

