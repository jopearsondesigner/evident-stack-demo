[workspace]
members = [
  "app/state/",
  "domain/collaboration",
  "domain/event-models",
  "domain/event-model-tests",
]

[workspace.dependencies]
async-trait = "0.1.68"
automerge = "0.4.1"
autosurgeon = "0.6.0"
base64 = "0.21"
epoch = { git = "https://github.com/Shearerbeard/Epoch", rev = "25e8a17", default-features = false }
itertools = "0.10.5"
js-sys = "0.3"
serde = "1.0.163"
serde_derive = "1.0.163"
serde_json = "1.0"
url = "2.3"
uuid = { version = "1.3.0", features = ["fast-rng", "serde"] }
wasm-bindgen = "0.2.63"
wasm-bindgen-futures = "0.4.34"
