[package]
name = "converge"
version = "0.1.0"
edition = "2021"

[features]
cbor = ["serde_cbor"]

[dependencies]
async-trait = "0.1.53"
rand = "0.8"
epoch = { git = "https://github.com/Shearerbeard/Epoch", branch = "decider", default-features = false, features = ["in_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_cbor = { version = "0.11", optional = true }

[dependencies.uuid]
version = "1.2.2"
features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde"
]
