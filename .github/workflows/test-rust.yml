---
name: Rust Check and Test
run-name: Commit by ${{ github.actor }}
on:
  push:
    paths:
      - 'domain/**'
      - 'app/state/**'
jobs:
  CheckTest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Cargo Check and Test
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
