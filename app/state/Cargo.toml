[package]
name = "state-client"
version = "0.1.0"
authors = ["Bobby Calderwood <8336+bobby@users.noreply.github.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
async-trait = { workspace = true }
event-models = { path = "../../domain/event-models", features = ["automerge"] }
automerge = { workspace = true }
autosurgeon = { workspace = true, features = ["uuid"] }
base64 = { workspace = true }
# domain_functions = { git = "https://github.com/evidentstack/domain_functions.rs" }
epoch = { workspace = true }
getrandom = { version = "0.2", features = ["js"] }
itertools = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.4"
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { version = "0.3", features = ["console", "Storage", "Window", "File", "Blob"] }
uuid = { workspace = true, features = ["v4", "js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }

# `wee_alloc` is a tiny allocator for wasm that is only ~1K in code size
# compared to the default allocator's ~10K. It is slower than the default
# allocator, however.
wee_alloc = { version = "0.4.5", optional = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

