[versions]
coroutines = "1.6.4"
kotlin = "1.7.21"
serialization = "1.4.1"
collections-immutable = "0.3.5"
uuid = "0.0.17"
arrow = "1.1.3"
valiktor = "0.12.0"
slf4j = "1.7.36"

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collections-immutable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "serialization" }
kotlinx-uuid-core = { module = "app.softwork:kotlinx-uuid-core", version.ref = "uuid" }
valiktor-core = { module = "org.valiktor:valiktor-core", version.ref = "valiktor" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
