[build]
  base = "app"
  command = "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env && rustup default 1.72.0 && curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh && npm run build"
  publish = "build"

[build.environment]
  PUBLIC_SUPABASE_URL = "https://example.supabase.co"
  PUBLIC_SUPABASE_ANON_KEY = "demo-key"