[package]
name = "automerge-event-models"
version = "0.1.0"
edition = "2021"

[dependencies]
automerge = "0.4.0"
autosurgeon = { version = "0.5.0", features = ["uuid"] }
event-models = { path = "../event-models" }
url = "2.3"

[dependencies.uuid]
version = "1.3"
features = [
    "v4",
    "v5",
    "fast-rng",
    "macro-diagnostics",
    "serde"
]
