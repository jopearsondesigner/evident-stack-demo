[package]
name = "convergent-event-models"
version = "0.1.0"
edition = "2021"

[dependencies]
event-models = { path = "../event-models" }
converge = { path = "../converge" }

[dependencies.uuid]
version = "1.2.2"
features = [
    "v4",
    "v5",
    "fast-rng",
    "macro-diagnostics",
    "serde"
]

[dev-dependencies]
event-models = { path = "../event-models", features = ["shared_tests"] }
