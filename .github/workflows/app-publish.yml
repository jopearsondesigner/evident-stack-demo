---
name: Publish App to Production
run-name: Production App publish by ${{ github.actor }}
on:
  release:
    types:
      - published
    paths:
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'domain/**'
      - 'components/**'
      - 'app/**'
jobs:
  Publish:
    runs-on: ubuntu-latest
    environment: evidentstack-app (Production)
    permissions:
      contents: read
      deployments: write
    name: Publish App to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref $PROJECT_ID
        env:
          PROJECT_ID: aqoqvlrxdcdiqwjxkrlr
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build editor-state
        run: npm -w app run state:build

      - name: Install dependencies
        run: npm -w app i && npm -w components i

      - name: Install playwright browsers
        run: npx playwright install --with-deps

      - name: Test
        run: npm -w app run check && npm -w app run test
        env:
          PUBLIC_SUPABASE_URL: https://aqoqvlrxdcdiqwjxkrlr.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxb3F2bHJ4ZGNkaXF3anhrcmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2ODQ3MTU4ODgsImV4cCI6MjAwMDI5MTg4OH0.Ys85T5JxY4AZyeH_oylJNs8fqnwvBDve-CQkYkE2YUA

      - name: Build
        run: npm -w app run build
        env:
          PUBLIC_SUPABASE_URL: https://aqoqvlrxdcdiqwjxkrlr.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxb3F2bHJ4ZGNkaXF3anhrcmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2ODQ3MTU4ODgsImV4cCI6MjAwMDI5MTg4OH0.Ys85T5JxY4AZyeH_oylJNs8fqnwvBDve-CQkYkE2YUA

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_KEY }}
          accountId: 24a2b0f48cf4f2d0cd375521394e63bd
          projectName: evidentstack-app
          directory: app/.svelte-kit/cloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          environment: production

